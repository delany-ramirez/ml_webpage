<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plantilla de widget</title>
  <!--
    CONTRATO DE WIDGET (ml.delanyr.dev)
    · Archivo HTML autocontenido en public/widgets/, sin dependencias externas salvo las fuentes.
    · Se embebe en <WidgetFrame> (iframe). El padre pasa el tema inicial por ?theme=dark|light
      y lo cambia en vivo con postMessage({ type: "THEME_CHANGE", theme }).
    · El widget avisa su alto real con postMessage({ type: "WIDGET_HEIGHT", height }) para que
      el iframe se ajuste (opcional: si no se envía, se usa el alto de widgets.json).
    · Colores SOLO a través de las variables de abajo, para que ambos temas se vean bien.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1219; --card: #151c27; --card-2: #1b2431;
      --line: rgba(232,236,242,.12); --text: #e9edf3; --muted: #8b96a8;
      --accent: #e3b058; --accent-soft: rgba(227,176,88,.16);
      --ok: #5fd08a; --err: #e0705f; --info: #7fb2e5;
      --font: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", monospace;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #f7f5f0; --card: #ffffff; --card-2: #efece5;
      --line: rgba(13,18,25,.12); --text: #141a22; --muted: #5b6673;
      --accent: #b8862f; --accent-soft: rgba(184,134,47,.16);
      --ok: #2f9e5b; --err: #c2483a; --info: #2f6fb0;
      color-scheme: light;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
    body { padding: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .mono { font-family: var(--mono); }
    h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    p.sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    label { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    input[type="range"] { accent-color: var(--accent); width: 100%; }
    button { font: inherit; font-family: var(--mono); font-size: 12.5px; color: var(--text); background: var(--card-2);
             border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Plantilla de widget</h1>
    <p class="sub">Copia este archivo, cambia el contenido y regístralo en <span class="mono">src/data/widgets.json</span>.</p>
    <button class="primary">Botón de ejemplo</button>
  </div>

  <script>
    // --- tema: inicial por ?theme=, en vivo por postMessage ---
    (function () {
      var q = new URLSearchParams(location.search).get("theme");
      if (q === "light" || q === "dark") document.documentElement.setAttribute("data-theme", q);
      window.addEventListener("message", function (e) {
        var d = e.data || {};
        if (d.type === "THEME_CHANGE" && (d.theme === "light" || d.theme === "dark")) {
          document.documentElement.setAttribute("data-theme", d.theme);
        }
      });
    })();
    // --- alto real → padre ---
    (function () {
      function avisar() {
        var h = document.documentElement.scrollHeight;
        if (window.parent !== window) window.parent.postMessage({ type: "WIDGET_HEIGHT", height: h }, "*");
      }
      window.addEventListener("load", avisar);
      if (window.ResizeObserver) new ResizeObserver(avisar).observe(document.body);
    })();
  </script>
</body>
</html>
