<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Descenso del gradiente y tasa de aprendizaje</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1219; --card: #151c27; --card-2: #1b2431;
      --line: rgba(232,236,242,.12); --text: #e9edf3; --muted: #8b96a8;
      --accent: #e3b058; --accent-soft: rgba(227,176,88,.16);
      --ok: #5fd08a; --err: #e0705f; --info: #7fb2e5;
      --font: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", monospace;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #f7f5f0; --card: #ffffff; --card-2: #efece5;
      --line: rgba(13,18,25,.12); --text: #141a22; --muted: #5b6673;
      --accent: #b8862f; --accent-soft: rgba(184,134,47,.16);
      --ok: #2f9e5b; --err: #c2483a; --info: #2f6fb0;
      color-scheme: light;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
    body { padding: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .mono { font-family: var(--mono); }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin-bottom: 12px; }
    .ctrl label { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .ctrl label b { color: var(--accent); font-weight: 500; }
    input[type="range"] { accent-color: var(--accent); width: 100%; }
    .botones { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    button { font: inherit; font-family: var(--mono); font-size: 12.5px; color: var(--text); background: var(--card-2);
             border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 500; }
    button.primary:hover { color: var(--bg); filter: brightness(1.08); }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-left: auto; }
    .seg button { border: 0; border-radius: 0; }
    .seg button.on { background: var(--accent-soft); color: var(--accent); }
    .graficos { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
    canvas { width: 100%; display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
    .lectura { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; font-family: var(--mono); font-size: 12px; }
    .lectura div { background: var(--card-2); border-radius: 8px; padding: 8px 10px; }
    .lectura span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .estado { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 1.4em; }
    .estado b { font-weight: 500; }
    .estado.ok b { color: var(--ok); } .estado.err b { color: var(--err); } .estado.warn b { color: var(--accent); }
    @media (max-width: 560px) { .fila, .graficos { grid-template-columns: 1fr; } .lectura { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="fila">
      <div class="ctrl">
        <label>tasa de aprendizaje η <b id="eta-v">0.10</b></label>
        <input type="range" id="eta" min="0.01" max="1.20" step="0.01" value="0.10" />
      </div>
      <div class="ctrl">
        <label>punto inicial w₀ <b id="w0-v">-3.0</b></label>
        <input type="range" id="w0" min="-4" max="8" step="0.1" value="-3" />
      </div>
    </div>
    <div class="botones">
      <button class="primary" id="paso">Un paso</button>
      <button id="play">Reproducir</button>
      <button id="reset">Reiniciar</button>
      <div class="seg" role="group" aria-label="Función de costo">
        <button class="on" data-fn="convexa">Convexa</button>
        <button data-fn="noconvexa">No convexa</button>
      </div>
    </div>
    <div class="graficos">
      <canvas id="c1" height="300" aria-label="Función de costo y trayectoria del descenso"></canvas>
      <canvas id="c2" height="300" aria-label="Costo por iteración"></canvas>
    </div>
    <div class="lectura">
      <div><span>iteración</span><span class="mono" id="it">0</span></div>
      <div><span>w</span><span class="mono" id="w">-3.000</span></div>
      <div><span>J(w)</span><span class="mono" id="j">—</span></div>
      <div><span>|∇J|</span><span class="mono" id="g">—</span></div>
    </div>
    <p class="estado" id="estado"></p>
  </div>

  <script>
    // ---------- contrato con el padre (tema y alto) ----------
    (function () {
      var q = new URLSearchParams(location.search).get("theme");
      if (q === "light" || q === "dark") document.documentElement.setAttribute("data-theme", q);
      window.addEventListener("message", function (e) {
        var d = e.data || {};
        if (d.type === "THEME_CHANGE" && (d.theme === "light" || d.theme === "dark")) {
          document.documentElement.setAttribute("data-theme", d.theme);
          dibujar();
        }
      });
      function avisar() {
        if (window.parent !== window) window.parent.postMessage({ type: "WIDGET_HEIGHT", height: document.documentElement.scrollHeight }, "*");
      }
      window.addEventListener("load", avisar);
      if (window.ResizeObserver) new ResizeObserver(avisar).observe(document.body);
    })();

    // ---------- funciones de costo ----------
    const FN = {
      convexa: {
        dom: [-4, 8], J: w => (w - 2) ** 2 + 0.5, dJ: w => 2 * (w - 2),
        nota: "J(w) = (w − 2)² + 0.5. El gradiente es 2(w − 2): con η < 1 converge, con η = 1 salta de un lado a otro sin acercarse, con η > 1 diverge."
      },
      noconvexa: {
        dom: [-4, 4], J: w => 0.08 * w ** 4 - 0.9 * w ** 2 + 0.35 * w + 4, dJ: w => 0.32 * w ** 3 - 1.8 * w + 0.35,
        nota: "J(w) = 0.08w⁴ − 0.9w² + 0.35w + 4. Tiene dos valles: el descenso se queda en el que le queda más cerca del punto inicial, no necesariamente en el mínimo global."
      }
    };
    let fn = "convexa", eta = 0.1, w0 = -3, w = w0, it = 0, hist = [], timer = null;
    const MAX_IT = 60;

    const $ = id => document.getElementById(id);
    const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

    function reiniciar() {
      clearInterval(timer); timer = null; $("play").textContent = "Reproducir";
      w = w0; it = 0; hist = [FN[fn].J(w)];
      dibujar(); leer();
    }
    function paso() {
      if (it >= MAX_IT || !isFinite(w)) return false;
      w = w - eta * FN[fn].dJ(w); it++; hist.push(FN[fn].J(w));
      dibujar(); leer();
      return true;
    }
    function leer() {
      const f = FN[fn], J = f.J(w), g = Math.abs(f.dJ(w));
      $("it").textContent = it; $("w").textContent = isFinite(w) ? w.toFixed(3) : "∞";
      $("j").textContent = isFinite(J) ? J.toFixed(3) : "∞"; $("g").textContent = isFinite(g) ? g.toFixed(3) : "∞";
      const e = $("estado"); e.className = "estado";
      if (!isFinite(w) || Math.abs(w) > 1e3) { e.className += " err"; e.innerHTML = "<b>Diverge:</b> la tasa es tan grande que cada paso se aleja más del mínimo. " + f.nota; }
      else if (it === 0) { e.innerHTML = f.nota; }
      else if (g < 1e-3) { e.className += " ok"; e.innerHTML = "<b>Convergió</b> en " + it + " iteraciones (|∇J| ≈ 0). " + f.nota; }
      else if (it >= 4 && hist[it] > hist[it - 2] * 0.999 && hist[it] > hist[it - 1] * 0.5) { e.className += " warn"; e.innerHTML = "<b>Oscila:</b> el costo no baja de forma monótona; la tasa es demasiado grande para la curvatura. " + f.nota; }
      else if (it >= MAX_IT) { e.className += " warn"; e.innerHTML = "<b>Tope de " + MAX_IT + " iteraciones</b> sin llegar a |∇J| ≈ 0: la tasa es pequeña para esta curvatura. " + f.nota; }
      else { e.innerHTML = "<b>Descendiendo…</b> " + f.nota; }
    }

    // ---------- dibujo ----------
    function prep(c) {
      const dpr = window.devicePixelRatio || 1, W = c.clientWidth;
      const H = c.id === "c2" && window.innerWidth <= 560 ? 170 : 300; // apilado: costo más bajo
      c.width = W * dpr; c.height = H * dpr; c.style.height = H + "px";
      const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, W, H };
    }
    function dibujar() {
      const f = FN[fn], [a, b] = f.dom;
      const colText = css("--text"), colMuted = css("--muted"), colLine = css("--line"), colAcc = css("--accent"), colInfo = css("--info"), colErr = css("--err");
      // --- c1: curva y trayectoria ---
      const { ctx, W, H } = prep($("c1"));
      const m = { l: 40, r: 14, t: 14, b: 28 };
      let jmin = Infinity, jmax = -Infinity;
      for (let i = 0; i <= 200; i++) { const v = f.J(a + (b - a) * i / 200); jmin = Math.min(jmin, v); jmax = Math.max(jmax, v); }
      jmin = Math.floor(jmin); jmax = Math.ceil(jmax * 1.05);
      const X = x => m.l + (x - a) / (b - a) * (W - m.l - m.r), Y = y => H - m.b - (y - jmin) / (jmax - jmin) * (H - m.t - m.b);
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = colLine; ctx.lineWidth = 1; ctx.font = "11px IBM Plex Mono, monospace"; ctx.fillStyle = colMuted;
      for (let i = 0; i <= 4; i++) { const y = jmin + (jmax - jmin) * i / 4; ctx.beginPath(); ctx.moveTo(m.l, Y(y)); ctx.lineTo(W - m.r, Y(y)); ctx.stroke(); ctx.fillText(y.toFixed(0), 6, Y(y) + 4); }
      for (let x = Math.ceil(a); x <= b; x += 2) { ctx.fillText(x, X(x) - 4, H - 8); }
      ctx.fillText("w", W - m.r - 10, H - 8); ctx.fillText("J(w)", m.l + 4, m.t + 10);
      ctx.strokeStyle = colInfo; ctx.lineWidth = 2; ctx.beginPath();
      for (let i = 0; i <= 200; i++) { const x = a + (b - a) * i / 200, y = f.J(x); i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y)); }
      ctx.stroke();
      // trayectoria
      let wi = w0; const pts = [wi];
      for (let i = 0; i < it; i++) { wi = wi - eta * f.dJ(wi); pts.push(wi); }
      ctx.strokeStyle = colAcc; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]); ctx.beginPath();
      pts.forEach((p, i) => { if (!isFinite(p)) return; const px = Math.max(m.l - 6, Math.min(W - m.r + 6, X(p))), py = Math.max(0, Math.min(H, Y(f.J(p)))); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
      ctx.stroke(); ctx.setLineDash([]);
      pts.forEach((p, i) => {
        if (!isFinite(p)) return;
        const px = X(p), py = Y(f.J(p)); if (px < m.l - 6 || px > W - m.r + 6 || py < 0) return;
        ctx.beginPath(); ctx.arc(px, py, i === pts.length - 1 ? 6 : 3.5, 0, Math.PI * 2);
        ctx.fillStyle = i === pts.length - 1 ? colAcc : colAcc + "99"; ctx.fill();
        if (i === pts.length - 1) { ctx.strokeStyle = colText; ctx.lineWidth = 1.5; ctx.stroke(); }
      });
      // --- c2: costo vs iteración ---
      const g2 = prep($("c2")); const c2 = g2.ctx, W2 = g2.W, H2 = g2.H, m2 = { l: 40, r: 10, t: 14, b: 28 };
      // techo del eje: hasta 5× el máximo de la curva; si diverge, la línea se pega al techo en rojo
      const hs = hist.filter(isFinite), hmax = Math.min(Math.max(jmax, ...hs.slice(0, 20)), jmax * 5), n = Math.max(MAX_IT / 3, hist.length);
      const X2 = i => m2.l + i / n * (W2 - m2.l - m2.r), Y2 = y => H2 - m2.b - Math.min(1, Math.max(0, (y - jmin) / (hmax - jmin))) * (H2 - m2.t - m2.b);
      c2.clearRect(0, 0, W2, H2); c2.strokeStyle = colLine; c2.lineWidth = 1; c2.fillStyle = colMuted; c2.font = "11px IBM Plex Mono, monospace";
      for (let i = 0; i <= 4; i++) { const y = jmin + (hmax - jmin) * i / 4; c2.beginPath(); c2.moveTo(m2.l, Y2(y)); c2.lineTo(W2 - m2.r, Y2(y)); c2.stroke(); c2.fillText(y.toFixed(0), 6, Y2(y) + 4); }
      c2.fillText("iteración", W2 - m2.r - 58, H2 - 8); c2.fillText("costo", m2.l + 4, m2.t + 10);
      c2.strokeStyle = hist.some(v => !isFinite(v) || v > hmax * 5) ? colErr : colAcc; c2.lineWidth = 2; c2.beginPath();
      hist.forEach((v, i) => { const y = isFinite(v) ? v : hmax * 10; i ? c2.lineTo(X2(i), Y2(y)) : c2.moveTo(X2(i), Y2(y)); });
      c2.stroke();
    }

    // ---------- eventos ----------
    $("eta").addEventListener("input", e => { eta = +e.target.value; $("eta-v").textContent = eta.toFixed(2); reiniciar(); });
    $("w0").addEventListener("input", e => { w0 = +e.target.value; $("w0-v").textContent = w0.toFixed(1); reiniciar(); });
    $("paso").addEventListener("click", paso);
    $("reset").addEventListener("click", reiniciar);
    $("play").addEventListener("click", () => {
      if (timer) { clearInterval(timer); timer = null; $("play").textContent = "Reproducir"; return; }
      if (it >= MAX_IT || !isFinite(w)) reiniciar();
      $("play").textContent = "Pausar";
      timer = setInterval(() => { if (!paso() || Math.abs(FN[fn].dJ(w)) < 1e-3) { clearInterval(timer); timer = null; $("play").textContent = "Reproducir"; } }, 220);
    });
    document.querySelectorAll("[data-fn]").forEach(b => b.addEventListener("click", () => {
      fn = b.dataset.fn; document.querySelectorAll("[data-fn]").forEach(x => x.classList.toggle("on", x === b));
      const [a, c] = FN[fn].dom; $("w0").min = a; $("w0").max = c; w0 = Math.max(a, Math.min(c, w0)); $("w0").value = w0; $("w0-v").textContent = w0.toFixed(1);
      reiniciar();
    }));
    window.addEventListener("resize", dibujar);
    reiniciar();
  </script>
</body>
</html>
