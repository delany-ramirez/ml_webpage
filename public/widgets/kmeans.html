<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K-Means paso a paso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1219; --card: #151c27; --card-2: #1b2431;
      --line: rgba(232,236,242,.12); --text: #e9edf3; --muted: #8b96a8;
      --accent: #e3b058; --accent-soft: rgba(227,176,88,.16);
      --ok: #5fd08a; --err: #e0705f; --info: #7fb2e5;
      --font: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", monospace;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #f7f5f0; --card: #ffffff; --card-2: #efece5;
      --line: rgba(13,18,25,.12); --text: #141a22; --muted: #5b6673;
      --accent: #b8862f; --accent-soft: rgba(184,134,47,.16);
      --ok: #2f9e5b; --err: #c2483a; --info: #2f6fb0;
      color-scheme: light;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
    body { padding: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .mono { font-family: var(--mono); }
    .fila { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px 18px; margin-bottom: 12px; }
    .ctrl label { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .ctrl label b { color: var(--accent); font-weight: 500; }
    input[type="range"] { accent-color: var(--accent); width: 100%; }
    .botones { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    button { font: inherit; font-family: var(--mono); font-size: 12.5px; color: var(--text); background: var(--card-2);
             border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 500; }
    button.primary:hover { color: var(--bg); filter: brightness(1.08); }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-left: auto; }
    .seg button { border: 0; border-radius: 0; }
    .seg button.on { background: var(--accent-soft); color: var(--accent); }
    .graficos { display: grid; grid-template-columns: 3fr 2fr; gap: 12px; }
    canvas { width: 100%; display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
    .lectura { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; font-family: var(--mono); font-size: 12px; }
    .lectura div { background: var(--card-2); border-radius: 8px; padding: 8px 10px; }
    .lectura span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .estado { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 1.4em; }
    .estado b { font-weight: 500; }
    .estado.ok b { color: var(--ok); } .estado.err b { color: var(--err); } .estado.warn b { color: var(--accent); }
    @media (max-width: 720px) { .fila { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { .fila, .graficos { grid-template-columns: 1fr; } .lectura { grid-template-columns: 1fr 1fr; } .seg { margin-left: 0; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="fila">
      <div class="ctrl">
        <label>k (grupos a buscar) <b id="k-v">3</b></label>
        <input type="range" id="k" min="1" max="8" step="1" value="3" />
      </div>
      <div class="ctrl">
        <label>grupos reales en los datos <b id="g-v">4</b></label>
        <input type="range" id="g" min="2" max="6" step="1" value="4" />
      </div>
      <div class="ctrl">
        <label>dispersión de los grupos <b id="s-v">0.6</b></label>
        <input type="range" id="s" min="0.2" max="1.4" step="0.1" value="0.6" />
      </div>
    </div>
    <div class="botones">
      <button class="primary" id="paso">Un paso</button>
      <button id="play">Reproducir</button>
      <button id="init">Reinicializar centroides</button>
      <button id="muestra">Nuevos datos</button>
      <div class="seg" role="group" aria-label="Inicialización">
        <button class="on" data-init="aleatoria">Aleatoria</button>
        <button data-init="kmeans++">k-means++</button>
      </div>
    </div>
    <div class="graficos">
      <canvas id="c1" height="320" aria-label="Puntos, asignación a grupos y trayectoria de los centroides"></canvas>
      <canvas id="c2" height="320" aria-label="Inercia frente a k (curva del codo)"></canvas>
    </div>
    <div class="lectura">
      <div><span>iteración · fase siguiente</span><span class="mono" id="l-it">0 · asignar</span></div>
      <div><span>inercia (suma de d² al centroide)</span><span class="mono" id="l-in">—</span></div>
      <div><span>puntos que cambiaron de grupo</span><span class="mono" id="l-ch">—</span></div>
      <div><span>mejor inercia conocida para este k</span><span class="mono" id="l-best">—</span></div>
    </div>
    <p class="estado" id="estado"></p>
  </div>

  <script>
    // ---------- contrato con el padre (tema y alto) ----------
    (function () {
      var q = new URLSearchParams(location.search).get("theme");
      if (q === "light" || q === "dark") document.documentElement.setAttribute("data-theme", q);
      window.addEventListener("message", function (e) {
        var d = e.data || {};
        if (d.type === "THEME_CHANGE" && (d.theme === "light" || d.theme === "dark")) {
          document.documentElement.setAttribute("data-theme", d.theme);
          dibujar();
        }
      });
      function avisar() {
        if (window.parent !== window) window.parent.postMessage({ type: "WIDGET_HEIGHT", height: document.documentElement.scrollHeight }, "*");
      }
      window.addEventListener("load", avisar);
      if (window.ResizeObserver) new ResizeObserver(avisar).observe(document.body);
    })();

    const $ = id => document.getElementById(id);
    const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    const N = 240, K_MAX = 8;
    const PALETA = ["#e3b058", "#7fb2e5", "#5fd08a", "#e0705f", "#c08ae0", "#e59b6a", "#6fd3c9", "#b5b5b5"];

    function rng(semilla) {
      let a = semilla >>> 0;
      return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    }
    function normal(r) { const u = 1 - r(), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
    const d2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2;

    let k = 3, grupos = 4, disp = 0.6, modoInit = "aleatoria", semilla = 5, semillaInit = 1;
    let X = [], asig = [], cent = [], trazas = [], it = 0, fase = "asignar", cambios = null, timer = null, codo = [];

    // ---------- datos: `grupos` gaussianas en posiciones fijas por semilla ----------
    function muestrear() {
      const r = rng(semilla);
      const centros = [];
      while (centros.length < grupos) { // centros separados al menos 2.6 unidades (hasta 60 intentos)
        let c, t = 0; do { c = [r() * 9 - 4.5, r() * 7 - 3.5]; t++; } while (t < 60 && centros.some(q => d2(c, q) < 2.6 ** 2));
        centros.push(c);
      }
      X = Array.from({ length: N }, (_, i) => { const c = centros[i % grupos]; return [c[0] + disp * normal(r), c[1] + disp * normal(r)]; });
      codo = []; for (let kk = 1; kk <= K_MAX; kk++) codo.push(mejorDe(kk, 8));
      inicializar();
    }

    // ---------- inicialización ----------
    function centroidesIniciales(kk, r, modo) {
      if (modo === "aleatoria") return Array.from({ length: kk }, () => [...X[Math.floor(r() * N)]]);
      const c = [[...X[Math.floor(r() * N)]]];
      while (c.length < kk) { // k-means++: probabilidad proporcional a d² al centroide más cercano
        const d = X.map(p => Math.min(...c.map(q => d2(p, q)))), tot = d.reduce((a, b) => a + b, 0);
        let u = r() * tot, i = 0; while (u > d[i] && i < N - 1) { u -= d[i]; i++; }
        c.push([...X[i]]);
      }
      return c;
    }
    function inicializar() {
      clearInterval(timer); timer = null; $("play").textContent = "Reproducir";
      cent = centroidesIniciales(k, rng(semillaInit * 7919 + semilla), modoInit);
      trazas = cent.map(c => [[...c]]); asig = X.map(() => -1); it = 0; fase = "asignar"; cambios = null;
      dibujar(); leer();
    }

    // ---------- el algoritmo, en sus dos fases ----------
    function asignar() {
      let ch = 0;
      asig = X.map((p, i) => { let m = 0; for (let j = 1; j < cent.length; j++) if (d2(p, cent[j]) < d2(p, cent[m])) m = j; if (m !== asig[i]) ch++; return m; });
      return ch;
    }
    function actualizar() {
      cent = cent.map((c, j) => { const P = X.filter((_, i) => asig[i] === j); return P.length ? [P.reduce((s, p) => s + p[0], 0) / P.length, P.reduce((s, p) => s + p[1], 0) / P.length] : c; });
      cent.forEach((c, j) => trazas[j].push([...c]));
    }
    const inercia = () => asig[0] < 0 ? null : X.reduce((s, p, i) => s + d2(p, cent[asig[i]]), 0);
    function paso() {
      const convergido = () => fase === "asignar" && cambios === 0 && it > 0;
      if (convergido()) return false;
      if (fase === "asignar") { cambios = asignar(); if (!convergido()) fase = "actualizar"; } // sin cambios: ya convergió, no hay nada que actualizar
      else { actualizar(); it++; fase = "asignar"; }
      dibujar(); leer();
      return !convergido();
    }
    function correr(kk, cIni) { // k-means completo, silencioso (para la curva del codo)
      let c = cIni, a = X.map(() => -1);
      for (let t = 0; t < 100; t++) {
        let ch = 0;
        a = X.map((p, i) => { let m = 0; for (let j = 1; j < c.length; j++) if (d2(p, c[j]) < d2(p, c[m])) m = j; if (m !== a[i]) ch++; return m; });
        if (!ch) break;
        c = c.map((q, j) => { const P = X.filter((_, i) => a[i] === j); return P.length ? [P.reduce((s, p) => s + p[0], 0) / P.length, P.reduce((s, p) => s + p[1], 0) / P.length] : q; });
      }
      return X.reduce((s, p, i) => s + d2(p, c[a[i]]), 0);
    }
    function mejorDe(kk, reps) { let b = Infinity; for (let r = 0; r < reps; r++) b = Math.min(b, correr(kk, centroidesIniciales(kk, rng(1000 * kk + r + semilla), "kmeans++"))); return b; }

    // ---------- lectura ----------
    function leer() {
      const I = inercia(), best = codo[k - 1];
      $("l-it").textContent = it + " · " + fase; $("l-in").textContent = I === null ? "—" : I.toFixed(1);
      $("l-ch").textContent = cambios === null ? "—" : cambios; $("l-best").textContent = best.toFixed(1);
      const e = $("estado"); e.className = "estado";
      const terminado = fase === "asignar" && cambios === 0 && it > 0;
      if (it === 0 && fase === "asignar") e.innerHTML = "Centroides iniciales (" + modoInit + "). <b>Un paso</b> alterna las dos fases: <b>asignar</b> cada punto a su centroide más cercano y <b>actualizar</b> cada centroide a la media de sus puntos. Cada fase reduce (o mantiene) la inercia.";
      else if (terminado && I > best * 1.02) { e.className += " err"; e.innerHTML = "<b>Convergió en un mínimo local.</b> Ningún punto cambia de grupo, pero la inercia (" + I.toFixed(1) + ") supera la mejor conocida para k = " + k + " (" + best.toFixed(1) + "). K-Means solo garantiza mínimos locales: por eso scikit-learn corre <span class='mono'>n_init</span> inicializaciones y se queda con la mejor, y por eso existe k-means++."; }
      else if (terminado) { e.className += " ok"; e.innerHTML = "<b>Convergió</b> en " + it + " iteraciones: ninguna asignación cambia. " + (k === grupos ? "k coincide con los grupos reales." : k < grupos ? "k = " + k + " < " + grupos + " grupos reales: algún centroide reparte dos grupos. Mira el codo." : "k = " + k + " > " + grupos + " grupos reales: la inercia sigue bajando, pero está partiendo grupos verdaderos. El codo lo delata."); }
      else if (fase === "actualizar") { e.className += " warn"; e.innerHTML = "<b>Fase de asignación hecha:</b> " + cambios + " puntos cambiaron de grupo. Sigue <b>actualizar</b>: mover cada centroide a la media de sus puntos."; }
      else { e.className += " warn"; e.innerHTML = "<b>Centroides actualizados</b> (iteración " + it + "). Sigue <b>asignar</b>: si ningún punto cambia de grupo, el algoritmo ha convergido."; }
    }

    // ---------- dibujo ----------
    function prep(c) {
      const dpr = window.devicePixelRatio || 1, W = c.clientWidth;
      const H = c.id === "c2" && window.innerWidth <= 560 ? 200 : 320;
      c.width = W * dpr; c.height = H * dpr; c.style.height = H + "px";
      const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, W, H };
    }
    function dibujar() {
      const colText = css("--text"), colMuted = css("--muted"), colLine = css("--line"), colAcc = css("--accent"), colInfo = css("--info");
      // --- c1: puntos y centroides ---
      const { ctx, W, H } = prep($("c1")), m = 14;
      // misma escala en x e y (las distancias deben verse como son), centrada en el rango de los datos
      const xs = X.map(p => p[0]), ys = X.map(p => p[1]), cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
      const esc = Math.min((W - 2 * m) / (Math.max(...xs) - Math.min(...xs) + 1), (H - 2 * m) / (Math.max(...ys) - Math.min(...ys) + 1));
      const Xp = x => W / 2 + (x - cx) * esc, Yp = y => H / 2 - (y - cy) * esc;
      ctx.clearRect(0, 0, W, H); ctx.strokeStyle = colLine; ctx.lineWidth = 1;
      for (let v = -8; v <= 8; v += 1) { ctx.beginPath(); ctx.moveTo(Xp(v), 0); ctx.lineTo(Xp(v), H); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, Yp(v)); ctx.lineTo(W, Yp(v)); ctx.stroke(); }
      X.forEach((p, i) => { ctx.beginPath(); ctx.arc(Xp(p[0]), Yp(p[1]), 3.2, 0, Math.PI * 2); ctx.fillStyle = asig[i] < 0 ? colMuted + "88" : PALETA[asig[i]] + "cc"; ctx.fill(); });
      trazas.forEach((t, j) => { ctx.strokeStyle = PALETA[j]; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]); ctx.beginPath(); t.forEach((c, i) => i ? ctx.lineTo(Xp(c[0]), Yp(c[1])) : ctx.moveTo(Xp(c[0]), Yp(c[1]))); ctx.stroke(); ctx.setLineDash([]); });
      cent.forEach((c, j) => { ctx.beginPath(); ctx.arc(Xp(c[0]), Yp(c[1]), 8, 0, Math.PI * 2); ctx.fillStyle = PALETA[j]; ctx.fill(); ctx.strokeStyle = colText; ctx.lineWidth = 2; ctx.stroke(); });
      ctx.fillStyle = colMuted; ctx.font = "11px IBM Plex Mono, monospace"; ctx.fillText("● punto  ◉ centroide  ╌ trayectoria", 8, 14);
      // --- c2: codo ---
      const g = prep($("c2")), c2 = g.ctx, W2 = g.W, H2 = g.H, m2 = { l: 46, r: 12, t: 14, b: 28 };
      const tope = codo[0] * 1.05;
      const X2 = kk => m2.l + (kk - 1) / (K_MAX - 1) * (W2 - m2.l - m2.r), Y2 = v => H2 - m2.b - Math.min(1, v / tope) * (H2 - m2.t - m2.b);
      c2.clearRect(0, 0, W2, H2); c2.strokeStyle = colLine; c2.lineWidth = 1; c2.fillStyle = colMuted; c2.font = "11px IBM Plex Mono, monospace";
      for (let i = 0; i <= 4; i++) { const v = tope * i / 4; c2.beginPath(); c2.moveTo(m2.l, Y2(v)); c2.lineTo(W2 - m2.r, Y2(v)); c2.stroke(); c2.fillText(v.toFixed(0), 6, Y2(v) + 4); }
      for (let kk = 1; kk <= K_MAX; kk++) c2.fillText(kk, X2(kk) - 3, H2 - 8);
      c2.fillText("k", W2 - m2.r - 8, m2.t + 10); c2.fillText("inercia (mejor de 8 inicios)", m2.l + 4, m2.t + 10);
      c2.strokeStyle = colInfo; c2.lineWidth = 2; c2.beginPath(); codo.forEach((v, i) => i ? c2.lineTo(X2(i + 1), Y2(v)) : c2.moveTo(X2(i + 1), Y2(v))); c2.stroke();
      codo.forEach((v, i) => { c2.beginPath(); c2.arc(X2(i + 1), Y2(v), 3.5, 0, Math.PI * 2); c2.fillStyle = colInfo; c2.fill(); });
      // grupos reales y k actual
      c2.strokeStyle = colMuted; c2.setLineDash([2, 3]); c2.beginPath(); c2.moveTo(X2(grupos), m2.t); c2.lineTo(X2(grupos), H2 - m2.b); c2.stroke(); c2.setLineDash([]);
      c2.fillStyle = colMuted; c2.fillText("reales", X2(grupos) - 18, H2 - m2.b - 4);
      const I = inercia();
      if (I !== null) { c2.fillStyle = colAcc; c2.beginPath(); c2.arc(X2(k), Y2(I), 6, 0, Math.PI * 2); c2.fill(); c2.strokeStyle = colText; c2.lineWidth = 1.5; c2.stroke(); c2.fillText("ahora", X2(k) + 9, Y2(I) + 4); }
    }

    // ---------- eventos ----------
    $("k").addEventListener("input", e => { k = +e.target.value; $("k-v").textContent = k; inicializar(); });
    $("g").addEventListener("input", e => { grupos = +e.target.value; $("g-v").textContent = grupos; muestrear(); });
    $("s").addEventListener("input", e => { disp = +e.target.value; $("s-v").textContent = disp.toFixed(1); muestrear(); });
    $("paso").addEventListener("click", paso);
    $("init").addEventListener("click", () => { semillaInit++; inicializar(); });
    $("muestra").addEventListener("click", () => { semilla = (semilla * 31 + 17) % 100003; muestrear(); });
    $("play").addEventListener("click", () => {
      if (timer) { clearInterval(timer); timer = null; $("play").textContent = "Reproducir"; return; }
      $("play").textContent = "Pausar";
      timer = setInterval(() => { if (!paso()) { clearInterval(timer); timer = null; $("play").textContent = "Reproducir"; } }, 500);
    });
    document.querySelectorAll("[data-init]").forEach(b => b.addEventListener("click", () => {
      modoInit = b.dataset.init; document.querySelectorAll("[data-init]").forEach(x => x.classList.toggle("on", x === b)); inicializar();
    }));
    window.addEventListener("resize", dibujar);
    muestrear();
  </script>
</body>
</html>
