<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mínimos cuadrados: el SSE como suma de áreas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1219; --card: #151c27; --card-2: #1b2431;
      --line: rgba(232,236,242,.12); --text: #e9edf3; --muted: #8b96a8;
      --accent: #e3b058; --accent-soft: rgba(227,176,88,.16);
      --ok: #5fd08a; --err: #e0705f; --info: #7fb2e5;
      --font: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", monospace;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #f7f5f0; --card: #ffffff; --card-2: #efece5;
      --line: rgba(13,18,25,.12); --text: #141a22; --muted: #5b6673;
      --accent: #b8862f; --accent-soft: rgba(184,134,47,.16);
      --ok: #2f9e5b; --err: #c2483a; --info: #2f6fb0;
      color-scheme: light;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
    body { padding: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .mono { font-family: var(--mono); }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin-bottom: 12px; }
    .ctrl label { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .ctrl label b { color: var(--accent); font-weight: 500; }
    input[type="range"] { accent-color: var(--accent); width: 100%; }
    .botones { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    button { font: inherit; font-family: var(--mono); font-size: 12.5px; color: var(--text); background: var(--card-2);
             border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 500; }
    button.primary:hover { color: var(--bg); filter: brightness(1.08); }
    .check { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; color: var(--muted); cursor: pointer; }
    .check:first-of-type { margin-left: auto; }
    .check input { accent-color: var(--accent); }
    .graficos { display: grid; grid-template-columns: 3fr 2fr; gap: 12px; }
    canvas { width: 100%; display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
    #c1 { cursor: grab; touch-action: none; }
    #c1.arrastrando { cursor: grabbing; }
    .ayuda { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .lectura { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; font-family: var(--mono); font-size: 12px; }
    .lectura div { background: var(--card-2); border-radius: 8px; padding: 8px 10px; }
    .lectura span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .lectura .sse { color: var(--err); } .lectura .r2 { color: var(--accent); }
    .estado { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 1.4em; }
    .estado b { font-weight: 500; }
    .estado.ok b { color: var(--ok); } .estado.err b { color: var(--err); } .estado.warn b { color: var(--accent); }
    @media (max-width: 560px) { .fila, .graficos { grid-template-columns: 1fr; } .lectura { grid-template-columns: 1fr 1fr; } .check:first-of-type { margin-left: 0; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="fila">
      <div class="ctrl">
        <label>intercepto β₀ <b id="b0-v">0.50</b></label>
        <input type="range" id="b0" min="-3" max="6" step="0.01" value="0.5" />
      </div>
      <div class="ctrl">
        <label>pendiente β₁ <b id="b1-v">0.80</b></label>
        <input type="range" id="b1" min="-1" max="2" step="0.005" value="0.8" />
      </div>
    </div>
    <div class="botones">
      <button id="ojo">Recta a ojo</button>
      <button id="media">Horizontal en ȳ</button>
      <button class="primary" id="ols">Mínimos cuadrados</button>
      <label class="check"><input type="checkbox" id="cuadrados" checked /> cuadrados</label>
      <label class="check"><input type="checkbox" id="vermedia" /> cuadrados de ȳ</label>
    </div>
    <div class="graficos">
      <div>
        <canvas id="c1" height="380" aria-label="Diez estudiantes, la recta y el cuadrado de cada residual"></canvas>
        <p class="ayuda">Arrastra los círculos de los extremos de la recta, o usa los deslizadores.</p>
      </div>
      <canvas id="c2" height="380" aria-label="Error al cuadrado de cada estudiante y SSE total comparado con el mínimo y con SS_tot"></canvas>
    </div>
    <div class="lectura">
      <div><span>recta</span><span class="mono" id="l-recta">—</span></div>
      <div><span>SSE = Σ eᵢ²</span><span class="mono sse" id="l-sse">—</span></div>
      <div><span>MSE = SSE / n</span><span class="mono" id="l-mse">—</span></div>
      <div><span>R² = 1 − SSE / SS<sub>tot</sub></span><span class="mono r2" id="l-r2">—</span></div>
    </div>
    <p class="estado" id="estado"></p>
  </div>

  <script>
    // ---------- contrato con el padre (tema y alto) ----------
    (function () {
      var q = new URLSearchParams(location.search).get("theme");
      if (q === "light" || q === "dark") document.documentElement.setAttribute("data-theme", q);
      window.addEventListener("message", function (e) {
        var d = e.data || {};
        if (d.type === "THEME_CHANGE" && (d.theme === "light" || d.theme === "dark")) {
          document.documentElement.setAttribute("data-theme", d.theme);
          dibujar();
        }
      });
      function avisar() {
        if (window.parent !== window) window.parent.postMessage({ type: "WIDGET_HEIGHT", height: document.documentElement.scrollHeight }, "*");
      }
      window.addEventListener("load", avisar);
      if (window.ResizeObserver) new ResizeObserver(avisar).observe(document.body);
    })();

    // ---------- datos: los 10 estudiantes de 00-regresion-lineal-intuicion.ipynb ----------
    // rendimiento-estudiantes.csv, sample(n=10, random_state=42), ordenados por promedio_anterior
    const $ = id => document.getElementById(id);
    const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    const XS = [3.09, 3.31, 3.47, 3.57, 3.61, 3.72, 4.07, 4.18, 4.23, 4.80];
    const YS = [3.58, 3.25, 2.76, 2.37, 3.17, 3.62, 3.49, 3.75, 3.77, 3.73];
    const N = XS.length;
    const LIM_X = [2.4, 5.3], LIM_Y = [1.9, 5.0];
    const xm = XS.reduce((s, v) => s + v, 0) / N, ym = YS.reduce((s, v) => s + v, 0) / N;
    const sxy = XS.reduce((s, x, i) => s + (x - xm) * (YS[i] - ym), 0), sxx = XS.reduce((s, x) => s + (x - xm) ** 2, 0);
    const OLS = [ym - (sxy / sxx) * xm, sxy / sxx];
    const OJO = [0.5, 0.8], MEDIA = [ym, 0];
    const sseDe = (b0, b1) => XS.reduce((s, x, i) => s + (YS[i] - b0 - b1 * x) ** 2, 0);
    const SSE_MIN = sseDe(...OLS), SS_TOT = sseDe(...MEDIA);

    let b0 = OJO[0], b1 = OJO[1];

    // ---------- lectura ----------
    function leer() {
      const sse = sseDe(b0, b1), r2 = 1 - sse / SS_TOT;
      $("b0-v").textContent = b0.toFixed(2); $("b1-v").textContent = b1.toFixed(3);
      $("l-recta").textContent = "ŷ = " + b0.toFixed(2) + (b1 < 0 ? " − " : " + ") + Math.abs(b1).toFixed(3) + "·x";
      $("l-sse").textContent = sse.toFixed(3); $("l-mse").textContent = (sse / N).toFixed(3); $("l-r2").textContent = r2.toFixed(3);
      const s = $("estado"), exceso = sse / SSE_MIN - 1;
      if (exceso < 0.002) { s.className = "estado ok"; s.innerHTML = "<b>Mínimo:</b> ninguna otra recta tiene menos área roja. Aquí β₁ = Σ(x−x̄)(y−ȳ) / Σ(x−x̄)² y la recta pasa por (x̄, ȳ); los residuales suman cero."; }
      else if (sse > SS_TOT + 1e-9) { s.className = "estado err"; s.innerHTML = "<b>Peor que la media:</b> esta recta deja más área que la horizontal en ȳ, así que R² es negativo. R² compara siempre contra ese modelo que ignora x."; }
      else if (Math.abs(b1) < 1e-9 && Math.abs(b0 - ym) < 0.005) { s.className = "estado warn"; s.innerHTML = "<b>Recta horizontal en ȳ:</b> su área es SS<sub>tot</sub> = " + SS_TOT.toFixed(3) + " y por eso R² = 0. Es la referencia contra la que se mide cualquier recta."; }
      else { s.className = "estado warn"; s.innerHTML = "<b>" + (100 * exceso).toFixed(1) + " % más área que el mínimo</b> (SSE mínimo = " + SSE_MIN.toFixed(3) + "). Un residual grande pesa mucho: al cuadrado, duplicar el error cuadruplica el área."; }
    }

    // ---------- dibujo ----------
    function prep(c) {
      const dpr = window.devicePixelRatio || 1, W = c.clientWidth;
      const H = window.innerWidth <= 560 ? (c.id === "c1" ? Math.round(W * 1.1) : 240) : 380;
      c.width = W * dpr; c.height = H * dpr; c.style.height = H + "px";
      const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, W, H };
    }
    // escala igual en x e y para que los cuadrados se vean cuadrados
    let geo = null;
    function geometria(W, H) {
      const m = { l: 34, r: 10, t: 10, b: 26 };
      const k = Math.min((W - m.l - m.r) / (LIM_X[1] - LIM_X[0]), (H - m.t - m.b) / (LIM_Y[1] - LIM_Y[0]));
      const ox = m.l + ((W - m.l - m.r) - k * (LIM_X[1] - LIM_X[0])) / 2, oy = H - m.b - ((H - m.t - m.b) - k * (LIM_Y[1] - LIM_Y[0])) / 2;
      return { k, X: x => ox + (x - LIM_X[0]) * k, Y: y => oy - (y - LIM_Y[0]) * k, iX: px => LIM_X[0] + (px - ox) / k, iY: py => LIM_Y[0] + (oy - py) / k, ox, oy };
    }
    const EXT = [2.5, 5.1]; // x de las asas de la recta

    function cuadrados(ctx, g, c0, c1, color, alfa) {
      ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 1;
      XS.forEach((x, i) => {
        const yh = c0 + c1 * x, lado = Math.abs(YS[i] - yh);
        const px = g.X(x), py = g.Y(Math.max(YS[i], yh)), l = lado * g.k;
        ctx.globalAlpha = alfa; ctx.fillRect(px, py, l, l); ctx.globalAlpha = Math.min(1, alfa * 2.6); ctx.strokeRect(px, py, l, l);
      });
      ctx.globalAlpha = 1;
    }

    function dibujar() {
      const colText = css("--text"), colMuted = css("--muted"), colLine = css("--line"), colAcc = css("--accent"), colErr = css("--err"), colInfo = css("--info"), colOk = css("--ok"), colBg = css("--bg");
      // --- c1: puntos, recta, residuales y cuadrados ---
      const c = $("c1"), { ctx, W, H } = prep(c); const g = geo = geometria(W, H);
      ctx.save(); ctx.clearRect(0, 0, W, H);
      ctx.beginPath(); ctx.rect(g.X(LIM_X[0]), g.Y(LIM_Y[1]), (LIM_X[1] - LIM_X[0]) * g.k, (LIM_Y[1] - LIM_Y[0]) * g.k); ctx.clip();
      ctx.strokeStyle = colLine; ctx.lineWidth = 1;
      for (let v = 2.5; v <= 5; v += 0.5) { ctx.beginPath(); ctx.moveTo(g.X(v), g.Y(LIM_Y[0])); ctx.lineTo(g.X(v), g.Y(LIM_Y[1])); ctx.stroke(); }
      for (let v = 2; v <= 5; v += 0.5) { ctx.beginPath(); ctx.moveTo(g.X(LIM_X[0]), g.Y(v)); ctx.lineTo(g.X(LIM_X[1]), g.Y(v)); ctx.stroke(); }
      if ($("vermedia").checked) {
        cuadrados(ctx, g, MEDIA[0], 0, colInfo, 0.10);
        ctx.strokeStyle = colInfo; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(g.X(LIM_X[0]), g.Y(ym)); ctx.lineTo(g.X(LIM_X[1]), g.Y(ym)); ctx.stroke(); ctx.setLineDash([]);
      }
      if ($("cuadrados").checked) cuadrados(ctx, g, b0, b1, colErr, 0.22);
      // residuales
      ctx.strokeStyle = colErr; ctx.lineWidth = 1.6;
      XS.forEach((x, i) => { ctx.beginPath(); ctx.moveTo(g.X(x), g.Y(YS[i])); ctx.lineTo(g.X(x), g.Y(b0 + b1 * x)); ctx.stroke(); });
      // recta
      ctx.strokeStyle = colAcc; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(g.X(LIM_X[0]), g.Y(b0 + b1 * LIM_X[0])); ctx.lineTo(g.X(LIM_X[1]), g.Y(b0 + b1 * LIM_X[1])); ctx.stroke();
      // puntos
      ctx.fillStyle = colText; XS.forEach((x, i) => { ctx.beginPath(); ctx.arc(g.X(x), g.Y(YS[i]), 4, 0, Math.PI * 2); ctx.fill(); });
      // asas
      EXT.forEach(x => { ctx.beginPath(); ctx.arc(g.X(x), g.Y(b0 + b1 * x), 7, 0, Math.PI * 2); ctx.fillStyle = colBg; ctx.fill(); ctx.lineWidth = 2.2; ctx.strokeStyle = colAcc; ctx.stroke(); });
      ctx.restore();
      ctx.font = "11px IBM Plex Mono, monospace"; ctx.fillStyle = colMuted;
      for (let v = 2.5; v <= 5; v += 0.5) ctx.fillText(v.toFixed(1), g.X(v) - 9, g.oy + 15);
      for (let v = 2; v <= 5; v += 0.5) ctx.fillText(v.toFixed(1), g.ox - 28, g.Y(v) + 4);
      ctx.fillText("promedio_anterior →", g.X(LIM_X[1]) - 136, g.oy - 8);
      ctx.fillText("nota_final", g.ox + 6, g.Y(LIM_Y[1]) + 14);

      // --- c2: eᵢ² por estudiante y SSE total ---
      const g2 = prep($("c2")), c2 = g2.ctx, W2 = g2.W, H2 = g2.H, m = { l: 38, r: 10, t: 22, b: 22 };
      c2.clearRect(0, 0, W2, H2); c2.font = "11px IBM Plex Mono, monospace";
      const e2 = XS.map((x, i) => (YS[i] - b0 - b1 * x) ** 2);
      const hBar = Math.round((H2 - m.t - m.b) * 0.58), yBase = m.t + hBar;
      const tope = Math.max(0.4, Math.ceil(Math.max(...e2) * 10) / 10);
      const anchoB = (W2 - m.l - m.r) / N;
      c2.strokeStyle = colLine; c2.lineWidth = 1; c2.fillStyle = colMuted;
      for (let i = 0; i <= 2; i++) { const v = tope * i / 2, y = yBase - v / tope * hBar; c2.beginPath(); c2.moveTo(m.l, y); c2.lineTo(W2 - m.r, y); c2.stroke(); c2.fillText(v.toFixed(2), 4, y + 4); }
      c2.fillStyle = colText; c2.fillText("eᵢ² por estudiante", m.l, 13);
      e2.forEach((v, i) => {
        const h = v / tope * hBar, x = m.l + i * anchoB + anchoB * 0.15;
        c2.globalAlpha = 0.55; c2.fillStyle = colErr; c2.fillRect(x, yBase - h, anchoB * 0.7, h); c2.globalAlpha = 1;
        c2.strokeStyle = colErr; c2.strokeRect(x, yBase - h, anchoB * 0.7, h);
      });
      // barra horizontal: SSE frente al mínimo y SS_tot
      const yS = yBase + 40, hS = 22, maxS = Math.max(SS_TOT * 1.25, sseDe(b0, b1) * 1.05);
      const XS2 = v => m.l + v / maxS * (W2 - m.l - m.r);
      c2.fillStyle = colText; c2.fillText("SSE = área roja total", m.l, yS - 8);
      c2.fillStyle = css("--card-2"); c2.fillRect(m.l, yS, W2 - m.l - m.r, hS);
      let acum = 0;
      e2.forEach((v, i) => { c2.globalAlpha = i % 2 ? 0.45 : 0.65; c2.fillStyle = colErr; c2.fillRect(XS2(acum), yS, XS2(acum + v) - XS2(acum), hS); acum += v; });
      c2.globalAlpha = 1;
      const marca = (v, col, txt, abajo) => {
        c2.strokeStyle = col; c2.lineWidth = 2; c2.beginPath(); c2.moveTo(XS2(v), yS - 4); c2.lineTo(XS2(v), yS + hS + 4); c2.stroke();
        c2.fillStyle = col; const t = txt + " " + v.toFixed(2), w = c2.measureText(t).width;
        c2.fillText(t, Math.max(2, Math.min(W2 - w - 2, XS2(v) - w / 2)), abajo ? yS + hS + 17 : yS + hS + 32);
      };
      marca(SSE_MIN, colOk, "mín", true);
      marca(SS_TOT, colInfo, "SS_tot", false);
    }

    // ---------- eventos ----------
    function poner(c0, c1) {
      b0 = Math.max(-3, Math.min(6, c0)); b1 = Math.max(-1, Math.min(2, c1));
      $("b0").value = b0; $("b1").value = b1; dibujar(); leer();
    }
    $("b0").addEventListener("input", e => { b0 = +e.target.value; dibujar(); leer(); });
    $("b1").addEventListener("input", e => { b1 = +e.target.value; dibujar(); leer(); });
    $("ojo").addEventListener("click", () => poner(...OJO));
    $("media").addEventListener("click", () => poner(...MEDIA));
    $("ols").addEventListener("click", () => poner(...OLS));
    $("cuadrados").addEventListener("change", dibujar);
    $("vermedia").addEventListener("change", dibujar);
    window.addEventListener("resize", dibujar);

    // arrastre de las asas: una queda fija y la otra sigue al puntero
    const c1 = $("c1"); let asa = -1;
    function pos(e) { const r = c1.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
    c1.addEventListener("pointerdown", e => {
      if (!geo) return; const [px, py] = pos(e);
      let mejor = -1, dmin = 22;
      EXT.forEach((x, i) => { const d = Math.hypot(px - geo.X(x), py - geo.Y(b0 + b1 * x)); if (d < dmin) { dmin = d; mejor = i; } });
      if (mejor < 0) { // clic cerca de la recta: arrastra el asa más cercana en x
        const yr = geo.Y(b0 + b1 * geo.iX(px)); if (Math.abs(py - yr) > 14) return;
        mejor = Math.abs(geo.iX(px) - EXT[0]) < Math.abs(geo.iX(px) - EXT[1]) ? 0 : 1;
      }
      asa = mejor; c1.setPointerCapture(e.pointerId); c1.classList.add("arrastrando"); e.preventDefault();
    });
    c1.addEventListener("pointermove", e => {
      if (asa < 0) return; const [, py] = pos(e);
      const yNueva = Math.max(LIM_Y[0], Math.min(LIM_Y[1], geo.iY(py)));
      const otra = 1 - asa, yOtra = b0 + b1 * EXT[otra];
      const pend = (yNueva - yOtra) / (EXT[asa] - EXT[otra]);
      poner(yOtra - pend * EXT[otra], pend);
    });
    const soltar = () => { asa = -1; c1.classList.remove("arrastrando"); };
    c1.addEventListener("pointerup", soltar); c1.addEventListener("pointercancel", soltar);

    poner(...OJO);
  </script>
</body>
</html>
