<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sub y sobreajuste: regresión polinómica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1219; --card: #151c27; --card-2: #1b2431;
      --line: rgba(232,236,242,.12); --text: #e9edf3; --muted: #8b96a8;
      --accent: #e3b058; --accent-soft: rgba(227,176,88,.16);
      --ok: #5fd08a; --err: #e0705f; --info: #7fb2e5;
      --font: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", monospace;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #f7f5f0; --card: #ffffff; --card-2: #efece5;
      --line: rgba(13,18,25,.12); --text: #141a22; --muted: #5b6673;
      --accent: #b8862f; --accent-soft: rgba(184,134,47,.16);
      --ok: #2f9e5b; --err: #c2483a; --info: #2f6fb0;
      color-scheme: light;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
    body { padding: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .mono { font-family: var(--mono); }
    .fila { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px 18px; margin-bottom: 12px; }
    .ctrl label { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .ctrl label b { color: var(--accent); font-weight: 500; }
    input[type="range"] { accent-color: var(--accent); width: 100%; }
    .botones { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    button { font: inherit; font-family: var(--mono); font-size: 12.5px; color: var(--text); background: var(--card-2);
             border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 500; }
    button.primary:hover { color: var(--bg); filter: brightness(1.08); }
    .check { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: auto; cursor: pointer; }
    .check input { accent-color: var(--accent); }
    .graficos { display: grid; grid-template-columns: 3fr 2fr; gap: 12px; }
    canvas { width: 100%; display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
    .lectura { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; font-family: var(--mono); font-size: 12px; }
    .lectura div { background: var(--card-2); border-radius: 8px; padding: 8px 10px; }
    .lectura span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .lectura .tr { color: var(--accent); } .lectura .te { color: var(--info); }
    .estado { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 1.4em; }
    .estado b { font-weight: 500; }
    .estado.ok b { color: var(--ok); } .estado.err b { color: var(--err); } .estado.warn b { color: var(--accent); }
    @media (max-width: 720px) { .fila { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { .fila, .graficos { grid-template-columns: 1fr; } .lectura { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="fila">
      <div class="ctrl">
        <label>grado del polinomio <b id="d-v">3</b></label>
        <input type="range" id="d" min="0" max="12" step="1" value="3" />
      </div>
      <div class="ctrl">
        <label>puntos de entrenamiento n <b id="n-v">20</b></label>
        <input type="range" id="n" min="8" max="80" step="1" value="20" />
      </div>
      <div class="ctrl">
        <label>ruido σ <b id="s-v">0.30</b></label>
        <input type="range" id="s" min="0" max="0.8" step="0.02" value="0.3" />
      </div>
    </div>
    <div class="botones">
      <button class="primary" id="muestra">Nueva muestra</button>
      <button id="mejor">Ir al mejor grado</button>
      <label class="check"><input type="checkbox" id="verdad" checked /> función verdadera</label>
    </div>
    <div class="graficos">
      <canvas id="c1" height="300" aria-label="Datos, función verdadera y polinomio ajustado"></canvas>
      <canvas id="c2" height="300" aria-label="Error de entrenamiento y de prueba según el grado"></canvas>
    </div>
    <div class="lectura">
      <div><span>grado</span><span class="mono" id="l-d">3</span></div>
      <div><span>MSE entrenamiento</span><span class="mono tr" id="l-tr">—</span></div>
      <div><span>MSE prueba</span><span class="mono te" id="l-te">—</span></div>
      <div><span>MSE mínimo posible (σ²)</span><span class="mono" id="l-min">—</span></div>
    </div>
    <p class="estado" id="estado"></p>
  </div>

  <script>
    // ---------- contrato con el padre (tema y alto) ----------
    (function () {
      var q = new URLSearchParams(location.search).get("theme");
      if (q === "light" || q === "dark") document.documentElement.setAttribute("data-theme", q);
      window.addEventListener("message", function (e) {
        var d = e.data || {};
        if (d.type === "THEME_CHANGE" && (d.theme === "light" || d.theme === "dark")) {
          document.documentElement.setAttribute("data-theme", d.theme);
          dibujar();
        }
      });
      function avisar() {
        if (window.parent !== window) window.parent.postMessage({ type: "WIDGET_HEIGHT", height: document.documentElement.scrollHeight }, "*");
      }
      window.addEventListener("load", avisar);
      if (window.ResizeObserver) new ResizeObserver(avisar).observe(document.body);
    })();

    // ---------- datos ----------
    const $ = id => document.getElementById(id);
    const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    const GRADO_MAX = 12, N_PRUEBA = 200;
    const verdadera = x => Math.sin(2 * Math.PI * x) + 0.3 * x;

    // generador con semilla (mulberry32) para que "Nueva muestra" sea reproducible
    function rng(semilla) {
      let a = semilla >>> 0;
      return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    }
    function normal(r) { const u = 1 - r(), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

    let grado = 3, n = 20, sigma = 0.3, semilla = 7;
    let entrena = [], prueba = [], errores = [];

    function muestrear() {
      const r = rng(semilla), rp = rng(1000 + semilla);
      entrena = Array.from({ length: n }, () => { const x = r(); return { x, y: verdadera(x) + sigma * normal(r) }; });
      prueba = Array.from({ length: N_PRUEBA }, () => { const x = rp(); return { x, y: verdadera(x) + sigma * normal(rp) }; });
      errores = [];
      for (let d = 0; d <= GRADO_MAX; d++) {
        const b = ajustar(entrena, d);
        errores.push({ tr: mse(entrena, b), te: mse(prueba, b) });
      }
    }

    // ---------- ajuste por mínimos cuadrados (ecuación normal con λ mínima por estabilidad) ----------
    const esc = x => 2 * x - 1; // [0,1] → [-1,1]: mejor condicionamiento del Vandermonde
    function feats(x, d) { const f = [1]; const z = esc(x); for (let k = 1; k <= d; k++) f.push(f[k - 1] * z); return f; }
    function ajustar(datos, d) {
      const p = d + 1, A = Array.from({ length: p }, () => new Array(p).fill(0)), b = new Array(p).fill(0);
      for (const { x, y } of datos) { const f = feats(x, d); for (let i = 0; i < p; i++) { b[i] += f[i] * y; for (let j = 0; j < p; j++) A[i][j] += f[i] * f[j]; } }
      for (let i = 0; i < p; i++) A[i][i] += 1e-9;
      return resolver(A, b);
    }
    function resolver(A, b) { // eliminación gaussiana con pivoteo parcial
      const p = b.length, M = A.map((f, i) => [...f, b[i]]);
      for (let c = 0; c < p; c++) {
        let piv = c; for (let r = c + 1; r < p; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
        [M[c], M[piv]] = [M[piv], M[c]];
        if (Math.abs(M[c][c]) < 1e-14) continue;
        for (let r = 0; r < p; r++) { if (r === c) continue; const k = M[r][c] / M[c][c]; for (let j = c; j <= p; j++) M[r][j] -= k * M[c][j]; }
      }
      return M.map((f, i) => Math.abs(f[i]) < 1e-14 ? 0 : f[p] / f[i]);
    }
    const predecir = (beta, x) => feats(x, beta.length - 1).reduce((s, f, i) => s + f * beta[i], 0);
    const mse = (datos, beta) => datos.reduce((s, { x, y }) => s + (predecir(beta, x) - y) ** 2, 0) / datos.length;

    // ---------- lectura ----------
    function leer() {
      const e = errores[grado], min = errores.reduce((m, v, i) => v.te < errores[m].te ? i : m, 0);
      $("l-d").textContent = grado; $("l-tr").textContent = e.tr.toFixed(3); $("l-te").textContent = e.te.toFixed(3);
      $("l-min").textContent = (sigma * sigma).toFixed(3);
      const s = $("estado"); s.className = "estado";
      const brecha = e.te / Math.max(e.tr, 1e-6);
      if (grado <= 2 && e.tr - sigma * sigma > 0.12) { s.className += " err"; s.innerHTML = "<b>Subajuste:</b> el modelo es demasiado rígido para la forma de los datos — error alto tanto en entrenamiento como en prueba (sesgo alto). Sube el grado."; }
      else if (brecha > 3 && grado > 3) { s.className += " err"; s.innerHTML = "<b>Sobreajuste:</b> el polinomio sigue el ruido de la muestra — error de entrenamiento casi nulo, error de prueba disparado (varianza alta). Con más puntos n, el mismo grado sobreajusta menos."; }
      else if (grado === min) { s.className += " ok"; s.innerHTML = "<b>Mejor grado para esta muestra</b> (mínimo del error de prueba). Ojo: el «mejor grado» cambia con la muestra; por eso se elige con validación cruzada, no con una sola partición."; }
      else { s.className += " warn"; s.innerHTML = "<b>Zona razonable.</b> El error de prueba nunca baja de σ² ≈ " + (sigma * sigma).toFixed(2) + ": es el ruido irreducible. El mejor grado para esta muestra es " + min + "."; }
    }

    // ---------- dibujo ----------
    function prep(c) {
      const dpr = window.devicePixelRatio || 1, W = c.clientWidth;
      const H = c.id === "c2" && window.innerWidth <= 560 ? 200 : 300;
      c.width = W * dpr; c.height = H * dpr; c.style.height = H + "px";
      const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, W, H };
    }
    function dibujar() {
      const colText = css("--text"), colMuted = css("--muted"), colLine = css("--line"), colAcc = css("--accent"), colInfo = css("--info"), colErr = css("--err");
      const beta = ajustar(entrena, grado);
      // --- c1: datos y curvas ---
      const { ctx, W, H } = prep($("c1")), m = { l: 34, r: 12, t: 12, b: 26 };
      const ymin = -2, ymax = 2;
      const X = x => m.l + x * (W - m.l - m.r), Y = y => H - m.b - (Math.max(ymin, Math.min(ymax, y)) - ymin) / (ymax - ymin) * (H - m.t - m.b);
      ctx.clearRect(0, 0, W, H); ctx.strokeStyle = colLine; ctx.lineWidth = 1; ctx.font = "11px IBM Plex Mono, monospace"; ctx.fillStyle = colMuted;
      for (let y = ymin; y <= ymax; y++) { ctx.beginPath(); ctx.moveTo(m.l, Y(y)); ctx.lineTo(W - m.r, Y(y)); ctx.stroke(); ctx.fillText(y, 8, Y(y) + 4); }
      for (let x = 0; x < 1; x += 0.25) ctx.fillText(x.toFixed(2), X(x) - 12, H - 8);
      ctx.fillText("x", W - m.r - 10, H - 8);
      if ($("verdad").checked) {
        ctx.strokeStyle = colMuted; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5; ctx.beginPath();
        for (let i = 0; i <= 200; i++) { const x = i / 200; i ? ctx.lineTo(X(x), Y(verdadera(x))) : ctx.moveTo(X(x), Y(verdadera(x))); }
        ctx.stroke(); ctx.setLineDash([]);
      }
      // prueba (huecos) y entrenamiento (rellenos)
      ctx.strokeStyle = colInfo; ctx.lineWidth = 1;
      for (const { x, y } of prueba) { if (y < ymin || y > ymax) continue; ctx.beginPath(); ctx.arc(X(x), Y(y), 2.2, 0, Math.PI * 2); ctx.stroke(); }
      ctx.fillStyle = colAcc;
      for (const { x, y } of entrena) { ctx.beginPath(); ctx.arc(X(x), Y(y), 4, 0, Math.PI * 2); ctx.fill(); }
      // polinomio
      ctx.strokeStyle = colAcc; ctx.lineWidth = 2.2; ctx.beginPath();
      for (let i = 0; i <= 300; i++) { const x = i / 300; i ? ctx.lineTo(X(x), Y(predecir(beta, x))) : ctx.moveTo(X(x), Y(predecir(beta, x))); }
      ctx.stroke();
      ctx.fillStyle = colText; ctx.fillText("● entrenamiento  ○ prueba  ╌ verdadera", m.l + 4, m.t + 10);
      // --- c2: error vs grado ---
      const g = prep($("c2")), c2 = g.ctx, W2 = g.W, H2 = g.H, m2 = { l: 40, r: 12, t: 14, b: 26 };
      const tope = Math.max(0.5, Math.min(2.5, Math.max(...errores.map(e => e.te)) * 1.1));
      const X2 = d => m2.l + d / GRADO_MAX * (W2 - m2.l - m2.r), Y2 = v => H2 - m2.b - Math.min(1, v / tope) * (H2 - m2.t - m2.b);
      c2.clearRect(0, 0, W2, H2); c2.strokeStyle = colLine; c2.lineWidth = 1; c2.fillStyle = colMuted; c2.font = "11px IBM Plex Mono, monospace";
      for (let i = 0; i <= 4; i++) { const v = tope * i / 4; c2.beginPath(); c2.moveTo(m2.l, Y2(v)); c2.lineTo(W2 - m2.r, Y2(v)); c2.stroke(); c2.fillText(v.toFixed(1), 8, Y2(v) + 4); }
      for (let d = 0; d < GRADO_MAX; d += 2) c2.fillText(d, X2(d) - 3, H2 - 8);
      c2.fillText("grado", W2 - m2.r - 34, H2 - 8); c2.fillText("MSE", m2.l + 4, m2.t + 10);
      // ruido irreducible
      c2.strokeStyle = colMuted; c2.setLineDash([3, 3]); c2.beginPath(); c2.moveTo(m2.l, Y2(sigma * sigma)); c2.lineTo(W2 - m2.r, Y2(sigma * sigma)); c2.stroke(); c2.setLineDash([]);
      const curva = (clave, color) => { c2.strokeStyle = color; c2.lineWidth = 2; c2.beginPath(); errores.forEach((e, d) => d ? c2.lineTo(X2(d), Y2(e[clave])) : c2.moveTo(X2(d), Y2(e[clave]))); c2.stroke(); };
      curva("te", colInfo); curva("tr", colAcc);
      // grado actual
      c2.strokeStyle = colErr; c2.lineWidth = 1; c2.setLineDash([2, 3]); c2.beginPath(); c2.moveTo(X2(grado), m2.t); c2.lineTo(X2(grado), H2 - m2.b); c2.stroke(); c2.setLineDash([]);
      [["te", colInfo], ["tr", colAcc]].forEach(([k, col]) => { c2.fillStyle = col; c2.beginPath(); c2.arc(X2(grado), Y2(errores[grado][k]), 4.5, 0, Math.PI * 2); c2.fill(); });
      c2.fillStyle = colAcc; c2.fillText("— entrenamiento", W2 - m2.r - 110, m2.t + 10);
      c2.fillStyle = colInfo; c2.fillText("— prueba", W2 - m2.r - 110, m2.t + 24);
    }

    // ---------- eventos ----------
    function actualizar() { muestrear(); dibujar(); leer(); }
    $("d").addEventListener("input", e => { grado = +e.target.value; $("d-v").textContent = grado; dibujar(); leer(); });
    $("n").addEventListener("input", e => { n = +e.target.value; $("n-v").textContent = n; actualizar(); });
    $("s").addEventListener("input", e => { sigma = +e.target.value; $("s-v").textContent = sigma.toFixed(2); actualizar(); });
    $("muestra").addEventListener("click", () => { semilla = (semilla * 31 + 17) % 100003; actualizar(); });
    $("mejor").addEventListener("click", () => { grado = errores.reduce((m, v, i) => v.te < errores[m].te ? i : m, 0); $("d").value = grado; $("d-v").textContent = grado; dibujar(); leer(); });
    $("verdad").addEventListener("change", dibujar);
    window.addEventListener("resize", dibujar);
    actualizar();
  </script>
</body>
</html>
