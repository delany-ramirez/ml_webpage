<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regresión logística: frontera, umbral, matriz de confusión y ROC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1219; --card: #151c27; --card-2: #1b2431;
      --line: rgba(232,236,242,.12); --text: #e9edf3; --muted: #8b96a8;
      --accent: #e3b058; --accent-soft: rgba(227,176,88,.16);
      --ok: #5fd08a; --err: #e0705f; --info: #7fb2e5;
      --font: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", monospace;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #f7f5f0; --card: #ffffff; --card-2: #efece5;
      --line: rgba(13,18,25,.12); --text: #141a22; --muted: #5b6673;
      --accent: #b8862f; --accent-soft: rgba(184,134,47,.16);
      --ok: #2f9e5b; --err: #c2483a; --info: #2f6fb0;
      color-scheme: light;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
    body { padding: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .mono { font-family: var(--mono); }
    .fila { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px 18px; margin-bottom: 12px; }
    .ctrl label { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .ctrl label b { color: var(--accent); font-weight: 500; }
    input[type="range"] { accent-color: var(--accent); width: 100%; }
    .botones { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    button { font: inherit; font-family: var(--mono); font-size: 12.5px; color: var(--text); background: var(--card-2);
             border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 500; }
    button.primary:hover { color: var(--bg); filter: brightness(1.08); }
    .graficos { display: grid; grid-template-columns: 3fr 2fr; gap: 12px; }
    canvas { width: 100%; display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
    .abajo { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin-top: 12px; align-items: start; }
    table.mc { border-collapse: separate; border-spacing: 4px; font-family: var(--mono); font-size: 12px; }
    table.mc th { color: var(--muted); font-weight: 400; padding: 2px 6px; text-align: center; }
    table.mc td { background: var(--card-2); border-radius: 8px; padding: 8px 12px; text-align: center; min-width: 74px; }
    table.mc td span { display: block; color: var(--muted); font-size: 10.5px; }
    table.mc td.vp { color: var(--ok); } table.mc td.fn, table.mc td.fp { color: var(--err); }
    .lectura { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; font-family: var(--mono); font-size: 12px; }
    .lectura div { background: var(--card-2); border-radius: 8px; padding: 8px 10px; }
    .lectura span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .estado { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 1.4em; }
    .estado b { font-weight: 500; }
    .estado.ok b { color: var(--ok); } .estado.err b { color: var(--err); } .estado.warn b { color: var(--accent); }
    @media (max-width: 760px) { .fila { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 640px) { .graficos, .abajo { grid-template-columns: 1fr; } .lectura { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="fila">
      <div class="ctrl">
        <label>umbral de decisión <b id="u-v">0.50</b></label>
        <input type="range" id="u" min="0.02" max="0.98" step="0.01" value="0.5" />
      </div>
      <div class="ctrl">
        <label>prevalencia de positivos <b id="p-v">20 %</b></label>
        <input type="range" id="p" min="0.05" max="0.5" step="0.05" value="0.2" />
      </div>
      <div class="ctrl">
        <label>separación entre clases <b id="sep-v">1.6</b></label>
        <input type="range" id="sep" min="0.4" max="3.5" step="0.1" value="1.6" />
      </div>
      <div class="ctrl">
        <label>costo FN / costo FP <b id="c-v">3</b></label>
        <input type="range" id="c" min="0.2" max="10" step="0.2" value="3" />
      </div>
    </div>
    <div class="botones">
      <button class="primary" id="b-costo">Umbral de mínimo costo</button>
      <button id="b-f1">Umbral que maximiza F1</button>
      <button id="b-05">Umbral 0.5</button>
      <button id="muestra">Nueva muestra</button>
    </div>
    <div class="graficos">
      <canvas id="c1" height="300" aria-label="Datos en dos dimensiones y frontera de decisión"></canvas>
      <canvas id="c2" height="300" aria-label="Curva ROC con el punto del umbral actual"></canvas>
    </div>
    <div class="abajo">
      <table class="mc" aria-label="Matriz de confusión">
        <tr><th></th><th>pred. +</th><th>pred. −</th></tr>
        <tr><th>real +</th><td class="vp" id="vp">0<span>VP</span></td><td class="fn" id="fn">0<span>FN</span></td></tr>
        <tr><th>real −</th><td class="fp" id="fp">0<span>FP</span></td><td class="vn" id="vn">0<span>VN</span></td></tr>
      </table>
      <div class="lectura">
        <div><span>accuracy · trivial</span><span class="mono" id="l-acc">—</span></div>
        <div><span>precisión</span><span class="mono" id="l-pre">—</span></div>
        <div><span>recall</span><span class="mono" id="l-rec">—</span></div>
        <div><span>F1</span><span class="mono" id="l-f1">—</span></div>
        <div><span>AUC-ROC</span><span class="mono" id="l-auc">—</span></div>
        <div><span>AP · prevalencia</span><span class="mono" id="l-ap">—</span></div>
        <div><span>costo (unid. FP)</span><span class="mono" id="l-costo">—</span></div>
        <div><span>costo mínimo · umbral</span><span class="mono" id="l-cmin">—</span></div>
      </div>
    </div>
    <p class="estado" id="estado"></p>
  </div>

  <script>
    // ---------- contrato con el padre (tema y alto) ----------
    (function () {
      var q = new URLSearchParams(location.search).get("theme");
      if (q === "light" || q === "dark") document.documentElement.setAttribute("data-theme", q);
      window.addEventListener("message", function (e) {
        var d = e.data || {};
        if (d.type === "THEME_CHANGE" && (d.theme === "light" || d.theme === "dark")) {
          document.documentElement.setAttribute("data-theme", d.theme);
          dibujar();
        }
      });
      function avisar() {
        if (window.parent !== window) window.parent.postMessage({ type: "WIDGET_HEIGHT", height: document.documentElement.scrollHeight }, "*");
      }
      window.addEventListener("load", avisar);
      if (window.ResizeObserver) new ResizeObserver(avisar).observe(document.body);
    })();

    const $ = id => document.getElementById(id);
    const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    const N = 320;

    function rng(semilla) {
      let a = semilla >>> 0;
      return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    }
    function normal(r) { const u = 1 - r(), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

    let umbral = 0.5, prev = 0.2, sep = 1.6, costoFN = 3, semilla = 11;
    let datos = [], beta = [0, 0, 0], orden = [], roc = [], auc = 0, ap = 0;

    // ---------- datos: dos gaussianas con solape, la positiva desplazada en diagonal ----------
    function muestrear() {
      const r = rng(semilla);
      datos = [];
      for (let i = 0; i < N; i++) {
        const y = r() < prev ? 1 : 0;
        const x1 = normal(r) + (y ? sep * 0.8 : 0), x2 = normal(r) * 1.1 + (y ? sep * 0.6 : 0);
        datos.push({ x1, x2, y });
      }
      ajustar();
    }

    // ---------- regresión logística por Newton-Raphson (IRLS), con L2 mínima por si hay separación perfecta ----------
    const sig = z => 1 / (1 + Math.exp(-z));
    function ajustar() {
      beta = [0, 0, 0];
      for (let it = 0; it < 25; it++) {
        const g = [0, 0, 0], H = [[1e-3, 0, 0], [0, 1e-3, 0], [0, 0, 1e-3]];
        for (const d of datos) {
          const f = [1, d.x1, d.x2], p = sig(f[0] * beta[0] + f[1] * beta[1] + f[2] * beta[2]), w = p * (1 - p);
          for (let i = 0; i < 3; i++) { g[i] += f[i] * (p - d.y); for (let j = 0; j < 3; j++) H[i][j] += w * f[i] * f[j]; }
        }
        for (let i = 0; i < 3; i++) g[i] += 1e-3 * beta[i];
        const paso = resolver3(H, g);
        for (let i = 0; i < 3; i++) beta[i] -= paso[i];
        if (Math.hypot(...paso) < 1e-8) break;
      }
      for (const d of datos) d.p = sig(beta[0] + beta[1] * d.x1 + beta[2] * d.x2);
      orden = [...datos].sort((a, b) => b.p - a.p);
      curvas();
    }
    function resolver3(A, b) {
      const M = A.map((f, i) => [...f, b[i]]);
      for (let c = 0; c < 3; c++) {
        let piv = c; for (let r = c + 1; r < 3; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
        [M[c], M[piv]] = [M[piv], M[c]];
        for (let r = 0; r < 3; r++) { if (r === c) continue; const k = M[r][c] / M[c][c]; for (let j = c; j <= 3; j++) M[r][j] -= k * M[c][j]; }
      }
      return M.map((f, i) => f[3] / f[i]);
    }

    // ---------- ROC, AUC, AP recorriendo todos los umbrales ----------
    function curvas() {
      const P = datos.filter(d => d.y).length, Nn = datos.length - P;
      roc = [{ fpr: 0, tpr: 0, pre: 1, u: 1 }]; auc = 0; ap = 0;
      let vp = 0, fp = 0, recPrev = 0;
      for (let i = 0; i < orden.length; i++) {
        if (orden[i].y) vp++; else fp++;
        if (i + 1 < orden.length && orden[i + 1].p === orden[i].p) continue; // empates: un solo punto
        const tpr = vp / P, fpr = fp / Nn, pre = vp / (vp + fp);
        const ant = roc[roc.length - 1];
        auc += (fpr - ant.fpr) * (tpr + ant.tpr) / 2;
        ap += (tpr - recPrev) * pre; recPrev = tpr;
        roc.push({ fpr, tpr, pre, u: orden[i].p });
      }
    }
    function confusion(u) {
      let vp = 0, fp = 0, fn = 0, vn = 0;
      for (const d of datos) { const pos = d.p >= u; if (d.y) { pos ? vp++ : fn++; } else { pos ? fp++ : vn++; } }
      return { vp, fp, fn, vn };
    }
    const costo = m => m.fp + costoFN * m.fn;
    function f1De(m) { const pre = m.vp / (m.vp + m.fp || 1), rec = m.vp / (m.vp + m.fn || 1); return pre + rec ? 2 * pre * rec / (pre + rec) : 0; }
    function mejorUmbral(f, signo) { // recorre los umbrales observados y devuelve el que optimiza f
      let mejor = 0.5, val = signo * Infinity;
      for (const r of roc) { const v = f(confusion(r.u)); if (signo * v < signo * val) { val = v; mejor = r.u; } }
      return { u: mejor, val };
    }

    // ---------- lectura ----------
    function leer() {
      const m = confusion(umbral), n = datos.length, P = m.vp + m.fn;
      const acc = (m.vp + m.vn) / n, pre = m.vp / (m.vp + m.fp || 1), rec = m.vp / P, f1 = f1De(m);
      $("vp").firstChild.textContent = m.vp; $("fn").firstChild.textContent = m.fn; $("fp").firstChild.textContent = m.fp; $("vn").firstChild.textContent = m.vn;
      $("l-acc").textContent = acc.toFixed(3) + " · " + (1 - P / n).toFixed(3);
      $("l-pre").textContent = m.vp + m.fp ? pre.toFixed(3) : "—"; $("l-rec").textContent = rec.toFixed(3); $("l-f1").textContent = f1.toFixed(3);
      $("l-auc").textContent = auc.toFixed(3); $("l-ap").textContent = ap.toFixed(3) + " · " + (P / n).toFixed(2);
      const cm = mejorUmbral(costo, 1);
      $("l-costo").textContent = costo(m).toFixed(0); $("l-cmin").textContent = cm.val.toFixed(0) + " · " + cm.u.toFixed(2);
      const e = $("estado"); e.className = "estado";
      if (m.vp + m.fp === 0) { e.className += " err"; e.innerHTML = "<b>Ningún positivo predicho.</b> La accuracy (" + acc.toFixed(2) + ") iguala a la referencia trivial de predecir siempre «no»: es alta y no sirve para nada. Recall = 0."; }
      else if (Math.abs(umbral - 0.5) < 0.011) { e.className += " warn"; e.innerHTML = "<b>Umbral 0.5: nadie lo eligió.</b> Con prevalencia " + (P / n * 100).toFixed(0) + " % y costo FN = " + costoFN + "× FP, el umbral de mínimo costo está en " + cm.u.toFixed(2) + " (" + ((costo(m) / cm.val - 1) * 100).toFixed(0) + " % más barato que 0.5). Mover el umbral no cambia el modelo ni la ROC: solo la decisión."; }
      else if (Math.abs(umbral - cm.u) < 0.02) { e.className += " ok"; e.innerHTML = "<b>Umbral de mínimo costo.</b> Aquí entra la métrica de negocio: el punto de la ROC se elige por los costos de cada error, no por simetría. En la práctica, este umbral se fija con probabilidades de validación cruzada y se reporta una sola vez sobre prueba."; }
      else if (rec >= 0.8) { e.className += " warn"; e.innerHTML = "<b>Recall ≥ 0.8.</b> Para encontrar 8 de cada 10 positivos la precisión baja a " + pre.toFixed(2) + ": cada positivo real cuesta " + (m.fp / Math.max(m.vp, 1)).toFixed(1) + " falsos positivos. Con prevalencia baja, la ROC lo disimula (FPR " + (m.fp / (m.fp + m.vn)).toFixed(2) + ") y la curva PR no."; }
      else { e.innerHTML = "La frontera es la recta donde p(x) = " + umbral.toFixed(2) + "; al mover el umbral se desplaza en paralelo (la ROC no cambia). AUC-ROC " + auc.toFixed(2) + " mide cuán bien ordena; AP " + ap.toFixed(2) + " frente a la prevalencia " + (P / n).toFixed(2) + " dice si sirve para el problema."; }
    }

    // ---------- dibujo ----------
    function prep(c) {
      const dpr = window.devicePixelRatio || 1, W = c.clientWidth;
      const H = c.id === "c2" && window.innerWidth <= 640 ? 240 : 300;
      c.width = W * dpr; c.height = H * dpr; c.style.height = H + "px";
      const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, W, H };
    }
    const logit = p => Math.log(p / (1 - p));
    function dibujar() {
      const colText = css("--text"), colMuted = css("--muted"), colLine = css("--line"), colAcc = css("--accent"), colInfo = css("--info"), colErr = css("--err"), colOk = css("--ok");
      // --- c1: dispersión + frontera ---
      const { ctx, W, H } = prep($("c1")), m = { l: 30, r: 12, t: 12, b: 24 };
      const lim = 3.6 + sep * 0.8;
      const X = x => m.l + (x + 3.2) / (lim + 3.2) * (W - m.l - m.r), Y = y => H - m.b - (y + 3.2) / (lim + 3.2) * (H - m.t - m.b);
      ctx.clearRect(0, 0, W, H); ctx.strokeStyle = colLine; ctx.lineWidth = 1; ctx.font = "11px IBM Plex Mono, monospace"; ctx.fillStyle = colMuted;
      for (let v = -3; v <= lim; v += 1) { ctx.beginPath(); ctx.moveTo(X(v), m.t); ctx.lineTo(X(v), H - m.b); ctx.stroke(); ctx.beginPath(); ctx.moveTo(m.l, Y(v)); ctx.lineTo(W - m.r, Y(v)); ctx.stroke(); }
      ctx.fillText("x₁", W - m.r - 16, H - 8); ctx.fillText("x₂", m.l + 4, m.t + 10);
      // región predicha positiva (sombra suave)
      const recta = u => { const c = beta[0] - logit(u); return x1 => -(c + beta[1] * x1) / beta[2]; };
      const f = recta(umbral), signo = beta[2] > 0 ? 1 : -1;
      ctx.fillStyle = colAcc + "14"; ctx.beginPath();
      ctx.moveTo(X(-3.2), Y(f(-3.2))); ctx.lineTo(X(lim), Y(f(lim))); ctx.lineTo(X(lim), signo > 0 ? m.t : H - m.b); ctx.lineTo(X(-3.2), signo > 0 ? m.t : H - m.b); ctx.closePath(); ctx.fill();
      // puntos: clase por color, error por borde
      for (const d of datos) {
        const pos = d.p >= umbral, err = pos !== !!d.y;
        ctx.beginPath(); ctx.arc(X(d.x1), Y(d.x2), d.y ? 4 : 3, 0, Math.PI * 2);
        ctx.fillStyle = d.y ? colAcc : colInfo + "aa"; ctx.fill();
        if (err) { ctx.strokeStyle = colErr; ctx.lineWidth = 1.6; ctx.stroke(); }
      }
      // frontera 0.5 (punteada) y actual (sólida)
      const traza = (u, dash, col, w) => { const g = recta(u); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(X(-3.2), Y(g(-3.2))); ctx.lineTo(X(lim), Y(g(lim))); ctx.stroke(); ctx.setLineDash([]); };
      traza(0.5, [5, 4], colMuted, 1.2); traza(umbral, [], colText, 2);
      ctx.fillStyle = colText; ctx.fillText("● pos  ● neg  ○ error  ╌ p=0.5  — p=" + umbral.toFixed(2), m.l + 4, H - m.b - 6);
      // --- c2: ROC ---
      const g2 = prep($("c2")), c2 = g2.ctx, W2 = g2.W, H2 = g2.H, m2 = { l: 36, r: 12, t: 14, b: 28 };
      const X2 = v => m2.l + v * (W2 - m2.l - m2.r), Y2 = v => H2 - m2.b - v * (H2 - m2.t - m2.b);
      c2.clearRect(0, 0, W2, H2); c2.strokeStyle = colLine; c2.lineWidth = 1; c2.fillStyle = colMuted; c2.font = "11px IBM Plex Mono, monospace";
      for (let i = 0; i <= 4; i++) { const v = i / 4; c2.beginPath(); c2.moveTo(X2(v), m2.t); c2.lineTo(X2(v), H2 - m2.b); c2.stroke(); c2.beginPath(); c2.moveTo(m2.l, Y2(v)); c2.lineTo(W2 - m2.r, Y2(v)); c2.stroke(); if (i < 4) c2.fillText(v.toFixed(2), X2(v) - 12, H2 - 8); c2.fillText(v.toFixed(1), 8, Y2(v) + 4); }
      c2.fillText("FPR", W2 - m2.r - 22, H2 - 8); c2.fillText("TPR (recall)", m2.l + 4, m2.t + 10);
      c2.strokeStyle = colMuted; c2.setLineDash([4, 4]); c2.beginPath(); c2.moveTo(X2(0), Y2(0)); c2.lineTo(X2(1), Y2(1)); c2.stroke(); c2.setLineDash([]);
      c2.strokeStyle = colInfo; c2.lineWidth = 2; c2.beginPath(); roc.forEach((r, i) => i ? c2.lineTo(X2(r.fpr), Y2(r.tpr)) : c2.moveTo(X2(r.fpr), Y2(r.tpr))); c2.lineTo(X2(1), Y2(1)); c2.stroke();
      const mc = confusion(umbral), fpr = mc.fp / (mc.fp + mc.vn), tpr = mc.vp / (mc.vp + mc.fn);
      c2.fillStyle = colAcc; c2.beginPath(); c2.arc(X2(fpr), Y2(tpr), 6, 0, Math.PI * 2); c2.fill(); c2.strokeStyle = colText; c2.lineWidth = 1.5; c2.stroke();
      c2.fillStyle = colText; c2.fillText("umbral " + umbral.toFixed(2), Math.min(X2(fpr) + 10, W2 - 90), Y2(tpr) + 14);
      c2.fillStyle = colInfo; c2.fillText("AUC " + auc.toFixed(3), W2 - m2.r - 68, H2 - m2.b - 8);
      c2.fillStyle = colOk;
    }

    // ---------- eventos ----------
    function ponerUmbral(u) { umbral = Math.max(0.02, Math.min(0.98, u)); $("u").value = umbral; $("u-v").textContent = umbral.toFixed(2); dibujar(); leer(); }
    $("u").addEventListener("input", e => ponerUmbral(+e.target.value));
    $("p").addEventListener("input", e => { prev = +e.target.value; $("p-v").textContent = Math.round(prev * 100) + " %"; muestrear(); dibujar(); leer(); });
    $("sep").addEventListener("input", e => { sep = +e.target.value; $("sep-v").textContent = sep.toFixed(1); muestrear(); dibujar(); leer(); });
    $("c").addEventListener("input", e => { costoFN = +e.target.value; $("c-v").textContent = costoFN.toFixed(1).replace(/\.0$/, ""); leer(); });
    $("b-costo").addEventListener("click", () => ponerUmbral(mejorUmbral(costo, 1).u));
    $("b-f1").addEventListener("click", () => ponerUmbral(mejorUmbral(f1De, -1).u));
    $("b-05").addEventListener("click", () => ponerUmbral(0.5));
    $("muestra").addEventListener("click", () => { semilla = (semilla * 31 + 17) % 100003; muestrear(); dibujar(); leer(); });
    window.addEventListener("resize", dibujar);
    muestrear(); dibujar(); leer();
  </script>
</body>
</html>
